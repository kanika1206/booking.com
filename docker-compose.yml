name: booking-prototype

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_local_only
      POSTGRES_DB: booking
    ports:
      - "5433:5432"
    volumes:
      - booking-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  booking-db:
